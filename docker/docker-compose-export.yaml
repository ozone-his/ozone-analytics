# Parquet/CSV export pipeline.
#
# Runs in Flink application mode: the image bakes in the pipeline, the JobManager runs it, and the
# TaskManager runs the same image with the command overridden. Runtime tuning (memory,
# parallelism, checkpointing, S3) belongs to ./flink/config/config.yaml -- which is why the
# JAVA_OPTS / *_MEMORY variables that used to be set here are gone. They configured the embedded
# MiniCluster that no longer exists, and would now be silently ignored.
services:
  parquet-export: &export
    networks:
      ozone-analytics:
    image: mekomsolutions/ozone-flink-parquet-export
    environment: &export-env
      - ANALYTICS_DB_USER=${ANALYTICS_DB_USER}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
      - ANALYTICS_DB_HOST=${ANALYTICS_DB_HOST}
      - ANALYTICS_DB_PORT=${ANALYTICS_DB_PORT}
      - ANALYTICS_DB_NAME=${ANALYTICS_DB_NAME}
      - EXPORT_OUTPUT_TAG=${EXPORT_OUTPUT_TAG}
      - ANALYTICS_CONFIG_FILE=/analytics/config.yaml
      # Credentials for the S3 (SeaweedFS) state store; endpoint and bucket live in config.yaml.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8084:8081"
    volumes: &export-volumes
      - ./flink/config/config.yaml:/opt/flink/conf/config.yaml
      - ${EXPORT_DESTINATION_TABLES_PATH}:/export/destination-tables
      - ${EXPORT_SOURCE_QUERIES_PATH}:/export/queries
      - ${EXPORT_OUTPUT_PATH}:/parquet
      - ${ANALYTICS_CONFIG_FILE}:/analytics/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Runs the actual work. Without it the JobManager accepts the job and then waits forever for
  # slots that never arrive.
  parquet-export-taskmanager:
    <<: *export
    command: taskmanager
    ports: []
    environment: *export-env
    volumes: *export-volumes
    depends_on:
      - parquet-export
networks:
  ozone-analytics:
