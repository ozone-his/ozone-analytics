services:
  # NOTE: the image is MariaDB, not MySQL; the service keeps the `mysql` name because hostnames and
  # credentials across the distro refer to it. Debezium 3.x reads it with its MariaDbConnector.
  #
  # Upgrading this from 10.3 rewrites the data directory -- see UPGRADING.md. Do not bump the
  # version without running that migration first: the server will refuse to start on a data
  # directory from a different major version.
  mysql:
    networks:
      ozone-analytics:
    restart: unless-stopped
    image: mariadb:${MARIADB_VERSION}
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --log-bin --binlog-format=ROW  --server-id=0 --max_connections=1024"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
    volumes:
      - ${MYSQL_DATADIR:-mysql-data}:/var/lib/mysql:rw
      - ./sqls/mysql/:/docker-entrypoint-initdb.d/

  # Holds the analytics, superset, hapi and odoo databases.
  #
  # Upgrading this from 13 requires a dump/restore -- see UPGRADING.md. PostgreSQL data directories
  # are major-version specific, so a newer server will refuse to start on an older one's data.
  postgresql:
    networks:
      ozone-analytics:
    restart: unless-stopped
    image: postgres:${POSTGRES_VERSION}
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Analystics
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      # Superset
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      # HAPI
      HAPI_DB_NAME: ${HAPI_DB_NAME}
      HAPI_DB_USER: ${HAPI_DB_USER}
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATADIR:-postgresql-data}:/var/lib/postgresql/data
      - "${SQL_SCRIPTS_PATH:-./sqls}/postgresql/create_db.sh:/docker-entrypoint-initdb.d/create_db.sh"
      - "${SQL_SCRIPTS_PATH:-./sqls}/postgresql/analytics:/docker-entrypoint-initdb.d/db/analytics"
      - "${SQL_SCRIPTS_PATH:-./sqls}/postgresql/superset:/docker-entrypoint-initdb.d/db/superset"
      - "${SQL_SCRIPTS_PATH:-./sqls}/postgresql/hapi:/docker-entrypoint-initdb.d/db/hapi"
volumes:
   mysql-data:
   postgresql-data: ~
networks:
  ozone-analytics:
