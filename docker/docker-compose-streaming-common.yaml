services:
  # Apache Kafka in KRaft mode: the broker runs its own controller quorum, so there is no
  # ZooKeeper. This replaces the debezium/kafka image, which pinned Kafka to whatever the Debezium
  # release shipped and is no longer published for current Debezium versions.
  kafka:
    restart: unless-stopped
    image: apache/kafka:${KAFKA_VERSION}
    networks:
      ozone-analytics:
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5Yr1SIgYQz-b-dgRabWx4g
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
  # Pre-creates every source-table topic. Debezium only creates a topic once a table has rows, so
  # without this the streaming jobs fail on topics that do not exist yet.
  kafka-setup:
    networks:
      ozone-analytics:
    restart: on-failure
    image: apache/kafka:${KAFKA_VERSION}
    command:
      - /bin/bash
      - -c
      - |
        IFS=',' read -ra topics <<< "$$TOPICS"
        for topic in $${topics[@]}
          do
            echo "Creating topic $$topic..."
            /opt/kafka/bin/kafka-topics.sh --create --topic $$topic --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:9092
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server=kafka:9092 --entity-type topics --entity-name $$topic --alter --add-config retention.ms=31556736000
        done
    environment:
     - TOPICS=${CREATE_TOPICS}
    depends_on:
      kafka:
        condition: service_healthy
  # Debezium 3.x, from quay.io (Docker Hub no longer receives current Debezium releases).
  #
  # The TimestampConverter SMT jar that used to be mounted here is gone: it existed because
  # Debezium 1.9 emitted temporal columns as epoch numbers, which the flattening SQL could not
  # read. Debezium 3.x emits them as formatted strings natively, so the workaround is obsolete.
  connect:
    restart: unless-stopped
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    networks:
      ozone-analytics:
    ports:
      - 8383:8083
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_CONFIG_PROVIDERS=file
      - CONNECT_CONFIG_PROVIDERS_FILE_CLASS=org.apache.kafka.common.config.provider.FileConfigProvider
      - CONNECT_MYSQL_HOSTNAME=${CONNECT_MYSQL_HOSTNAME:-mysql}
      - CONNECT_MYSQL_USERNAME=${CONNECT_MYSQL_USERNAME:-root}
      - CONNECT_MYSQL_PASSWORD=${CONNECT_MYSQL_PASSWORD:-${CONNECT_MYSQL_PASSWORD}}
      - CONNECT_MYSQL_PORT=${CONNECT_MYSQL_PORT:-${CONNECT_MYSQL_PORT}}
      - CONNECT_MYSQL_SERVER_ID=37991
      - CONNECT_MYSQL_SERVER_NAME=emr
      - CONNECT_MYSQL_INCLUDE_LIST=openmrs
      - CONNECT_TABLE_EXCLUDE_LIST=openmrs.audit_log
      - CONNECT_MYSQL_HISTROY_TOPIC=dbhistory.openmrs
      - CONNECT_MYSQL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONNECT_ODOO_DB_HOSTNAME=${CONNECT_ODOO_DB_HOSTNAME:-postgresql}
      - CONNECT_ODOO_DB_USERNAME=${CONNECT_ODOO_DB_USERNAME:-${POSTGRES_USER}}
      - CONNECT_ODOO_DB_PASSWORD=${CONNECT_ODOO_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - CONNECT_ODOO_DB_PORT=${CONNECT_ODOO_DB_PORT:-5432}
      # Debezium's PostgreSQL connector requires the database name explicitly.
      - CONNECT_ODOO_DB_NAME=${CONNECT_ODOO_DB_NAME:-odoo}
      - CONNECT_ODOO_DB_SERVER_NAME=erp
      - CONNECT_ODOO_DB_INCLUDE_LIST=odoo

  # Registers the Debezium connectors once Connect is up. A stock curl one-shot that PUTs the
  # connector definitions in ./connect, replacing the bespoke ozone-analytics-setup-connect image.
  # The ${file:...} references in those files are resolved by Connect at registration time, so no
  # secrets pass through here.
  connect-setup:
    image: curlimages/curl:8.11.1
    restart: on-failure
    networks:
      ozone-analytics:
    depends_on:
      - connect
    volumes:
      - ./connect:/connectors:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf http://connect:8083/connectors >/dev/null 2>&1; do
          echo "waiting for kafka connect..."; sleep 3
        done
        for f in /connectors/*.json; do
          name=$$(basename "$$f" .json)
          echo "registering $$name"
          curl -sS --fail -X PUT -H 'Content-Type: application/json' \
            --data @"$$f" "http://connect:8083/connectors/$$name/config" || exit 1
        done
        echo "connectors registered"
  # Flink cluster for the streaming pipeline, in application mode.
  #
  # The jobs used to boot an embedded MiniCluster inside their own JVM, tuned through the
  # JAVA_OPTS / *_MEMORY / TASK_MANAGER_SLOTS environment variables that used to be listed here.
  # They now run on this cluster, which owns that configuration in ./flink/config/config.yaml, so
  # those variables are gone: they would be silently ignored.
  #
  # The image decides which pipeline it runs, so the JobManager runs its baked-in command and the
  # TaskManager runs the same image with the command overridden.
  jobmanager: &flink
    networks:
      ozone-analytics:
    restart: unless-stopped
    image: mekomsolutions/ozone-flink-jobs
    ports:
      - "8085:8081"
      - "9250:9250"
    depends_on:
       analytics-migration:
          condition: service_completed_successfully
       kafka:
         condition: service_healthy
       kafka-setup:
         condition: service_completed_successfully
    labels:
      - kompose.service.group=flink-manager
    environment: &flink-env
      - ANALYTICS_SOURCE_TABLES_PATH=/analytics/source-tables
      - ANALYTICS_QUERIES_PATH=/analytics/queries
      - ANALYTICS_DB_NAME=${ANALYTICS_DB_NAME}
      - ANALYTICS_DB_USER=${ANALYTICS_DB_USER}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
      - ANALYTICS_DB_HOST=${ANALYTICS_DB_HOST}
      - ANALYTICS_DB_PORT=${ANALYTICS_DB_PORT}
      - ANALYTICS_KAFKA_URL=${ANALYTICS_KAFKA_URL}
      - OPENMRS_DB_NAME=${OPENMRS_DB_NAME}
      - OPENMRS_DB_USER=${OPENMRS_DB_USER}
      - OPENMRS_DB_PASSWORD=${OPENMRS_DB_PASSWORD}
      - OPENMRS_DB_HOST=${OPENMRS_DB_HOST}
      - OPENMRS_DB_PORT=${OPENMRS_DB_PORT}
      - ODOO_DB_NAME=${ODOO_DB_NAME:-odoo}
      - ODOO_DB_USER=${ODOO_DB_USER:-postgres}
      - ODOO_DB_PASSWORD=${ODOO_DB_PASSWORD:-password}
      - ODOO_DB_HOST=${ODOO_DB_HOST:-postgresql}
      - ODOO_DB_PORT=${ODOO_DB_PORT:-5432}
      - ANALYTICS_CONFIG_FILE=/analytics/config.yaml
      # Credentials for the S3 (MinIO) checkpoint and savepoint store, read by the standard AWS
      # credential chain. The bucket and endpoint themselves are set in flink/config/config.yaml.
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    volumes: &flink-volumes
      - flink-shared-data:/tmp
      - ./data:/data
      - ./flink/config/config.yaml:/opt/flink/conf/config.yaml
      - ${ANALYTICS_SOURCE_TABLES_PATH}:/analytics/source-tables
      - ${ANALYTICS_QUERIES_PATH}:/analytics/queries
      - ${ANALYTICS_CONFIG_FILE}:/analytics/config.yaml

  # Runs the actual work. Without this the JobManager accepts the job and then waits forever for
  # slots that never arrive, because the embedded MiniCluster that used to supply them is gone.
  taskmanager:
    <<: *flink
    command: taskmanager
    ports: []
    environment: *flink-env
    volumes: *flink-volumes
    labels:
      - kompose.service.group=flink-manager
    depends_on:
      - jobmanager
    deploy:
      replicas: ${TASK_MANAGER_REPLICAS:-1}
volumes:
   flink-shared-data: ~
   kafka-data: ~
networks:
  ozone-analytics:
