services:
  # Apache Kafka in KRaft mode: the broker runs its own controller quorum, so there is no
  # ZooKeeper. This replaces the debezium/kafka image, which pinned Kafka to whatever the Debezium
  # release shipped and is no longer published for current Debezium versions.
  kafka:
    restart: unless-stopped
    image: apache/kafka:${KAFKA_VERSION}
    networks:
      ozone-analytics:
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5Yr1SIgYQz-b-dgRabWx4g
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
  # Pre-creates every source-table topic. Debezium only creates a topic once a table has rows, so
  # without this the streaming jobs fail on topics that do not exist yet.
  kafka-setup:
    networks:
      ozone-analytics:
    restart: on-failure
    image: apache/kafka:${KAFKA_VERSION}
    command:
      - /bin/bash
      - -c
      - |
        IFS=',' read -ra topics <<< "$$TOPICS"
        for topic in $${topics[@]}
          do
            echo "Creating topic $$topic..."
            /opt/kafka/bin/kafka-topics.sh --create --topic $$topic --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:9092
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server=kafka:9092 --entity-type topics --entity-name $$topic --alter --add-config retention.ms=31556736000
        done
    environment:
     - TOPICS=${CREATE_TOPICS}
    depends_on:
      kafka:
        condition: service_healthy
  # Debezium 3.x, from quay.io (Docker Hub no longer receives current Debezium releases).
  #
  # The TimestampConverter SMT jar that used to be mounted here is gone: it existed because
  # Debezium 1.9 emitted temporal columns as epoch numbers, which the flattening SQL could not
  # read. Debezium 3.x emits them as formatted strings natively, so the workaround is obsolete.
  connect:
    restart: unless-stopped
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    networks:
      ozone-analytics:
    ports:
      - 8383:8083
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_CONFIG_PROVIDERS=file
      - CONNECT_CONFIG_PROVIDERS_FILE_CLASS=org.apache.kafka.common.config.provider.FileConfigProvider
      - CONNECT_MYSQL_HOSTNAME=${CONNECT_MYSQL_HOSTNAME:-mysql}
      - CONNECT_MYSQL_USERNAME=${CONNECT_MYSQL_USERNAME:-root}
      - CONNECT_MYSQL_PASSWORD=${CONNECT_MYSQL_PASSWORD:-${CONNECT_MYSQL_PASSWORD}}
      - CONNECT_MYSQL_PORT=${CONNECT_MYSQL_PORT:-${CONNECT_MYSQL_PORT}}
      - CONNECT_MYSQL_SERVER_ID=37991
      - CONNECT_MYSQL_SERVER_NAME=emr
      - CONNECT_MYSQL_INCLUDE_LIST=openmrs
      - CONNECT_TABLE_EXCLUDE_LIST=openmrs.audit_log
      - CONNECT_MYSQL_HISTROY_TOPIC=dbhistory.openmrs
      - CONNECT_MYSQL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONNECT_ODOO_DB_HOSTNAME=${CONNECT_ODOO_DB_HOSTNAME:-postgresql}
      - CONNECT_ODOO_DB_USERNAME=${CONNECT_ODOO_DB_USERNAME:-${POSTGRES_USER}}
      - CONNECT_ODOO_DB_PASSWORD=${CONNECT_ODOO_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - CONNECT_ODOO_DB_PORT=${CONNECT_ODOO_DB_PORT:-5432}
      # Debezium's PostgreSQL connector requires the database name explicitly.
      - CONNECT_ODOO_DB_NAME=${CONNECT_ODOO_DB_NAME:-odoo}
      - CONNECT_ODOO_DB_SERVER_NAME=erp
      - CONNECT_ODOO_DB_INCLUDE_LIST=odoo

  # Registers the Debezium connectors once Connect is up. A stock curl one-shot that PUTs the
  # connector definitions in ./connect, replacing the bespoke ozone-analytics-setup-connect image.
  # The ${file:...} references in those files are resolved by Connect at registration time, so no
  # secrets pass through here.
  connect-setup:
    image: curlimages/curl:8.11.1
    restart: on-failure
    networks:
      ozone-analytics:
    depends_on:
      - connect
    volumes:
      - ./connect:/connectors:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf http://connect:8083/connectors >/dev/null 2>&1; do
          echo "waiting for kafka connect..."; sleep 3
        done
        for f in /connectors/*.json; do
          name=$$(basename "$$f" .json)
          echo "registering $$name"
          curl -sS --fail -X PUT -H 'Content-Type: application/json' \
            --data @"$$f" "http://connect:8083/connectors/$$name/config" || exit 1
        done
        echo "connectors registered"
  # ---------------------------------------------------------------------------
  # Streaming: a Flink SESSION cluster with high availability.
  #
  # The streaming jobs run for as long as the pipeline exists. Rather than bake them into the
  # application image -- application mode cannot give a cluster running many jobs HA -- they are
  # submitted to this long-lived session cluster by the job-submitter below. HA (ZooKeeper + S3)
  # lets the JobManager recover the running jobs from their last checkpoint after a restart.
  #
  # HA lives in config-ha.yaml, not the shared config.yaml: the batch and export jobs run in
  # application mode on config.yaml and must not enable HA. Batch and export are unchanged.
  # ---------------------------------------------------------------------------

  # Flink's HA backend. Kafka runs in KRaft mode, so this ZooKeeper is dedicated to Flink.
  zookeeper:
    networks:
      ozone-analytics:
    image: zookeeper:3.9
    restart: unless-stopped

  # Session cluster. Uses the base Flink image, not ozone-flink-jobs-streaming: the application jar is not on
  # the cluster classpath (usrlib is only loaded in application mode) -- it rides in with each job
  # the submitter uploads. The S3 plugin is enabled from opt/ for checkpoints and the HA store.
  jobmanager: &flink-cluster
    networks:
      ozone-analytics:
    image: flink:2.3.0-java17
    restart: unless-stopped
    command: [ "jobmanager" ]
    ports:
      - "8085:8081"
      - "9250:9250"
    environment: &flink-cluster-env
      - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-presto-2.3.0.jar
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./flink/config/config-ha.yaml:/opt/flink/conf/config.yaml:ro
    depends_on:
      zookeeper:
        condition: service_started
      # Not just SeaweedFS healthy: the HA storageDir lives in flink-state-bucket, so the bucket must
      # exist before the JobManager initializes its HA services.
      seaweedfs-buckets:
        condition: service_completed_successfully

  taskmanager:
    <<: *flink-cluster
    command: [ "taskmanager" ]
    ports: []
    depends_on:
      - jobmanager
    deploy:
      replicas: ${TASK_MANAGER_REPLICAS:-1}

  # Client that submits the streaming jobs to the session cluster, then exits. The only place the
  # application jar (mekomsolutions/ozone-flink-jobs-streaming) and the pipeline config live.
  # Idempotent: if the cluster already has jobs running (recovered from HA after a restart), it does
  # not resubmit.
  job-submitter:
    networks:
      ozone-analytics:
    image: mekomsolutions/ozone-flink-jobs-streaming
    restart: on-failure
    volumes:
      - ./flink/config/config.yaml:/opt/flink/conf/config.yaml:ro
      - ${ANALYTICS_SOURCE_TABLES_PATH}:/analytics/source-tables:ro
      - ${ANALYTICS_QUERIES_PATH}:/analytics/queries:ro
      - ${ANALYTICS_CONFIG_FILE}:/analytics/config.yaml:ro
    environment:
      - ANALYTICS_SOURCE_TABLES_PATH=/analytics/source-tables
      - ANALYTICS_QUERIES_PATH=/analytics/queries
      - ANALYTICS_DB_NAME=${ANALYTICS_DB_NAME}
      - ANALYTICS_DB_USER=${ANALYTICS_DB_USER}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
      - ANALYTICS_DB_HOST=${ANALYTICS_DB_HOST}
      - ANALYTICS_DB_PORT=${ANALYTICS_DB_PORT}
      - ANALYTICS_KAFKA_URL=${ANALYTICS_KAFKA_URL}
      - OPENMRS_DB_NAME=${OPENMRS_DB_NAME}
      - OPENMRS_DB_USER=${OPENMRS_DB_USER}
      - OPENMRS_DB_PASSWORD=${OPENMRS_DB_PASSWORD}
      - OPENMRS_DB_HOST=${OPENMRS_DB_HOST}
      - OPENMRS_DB_PORT=${OPENMRS_DB_PORT}
      - ODOO_DB_NAME=${ODOO_DB_NAME:-odoo}
      - ODOO_DB_USER=${ODOO_DB_USER:-postgres}
      - ODOO_DB_PASSWORD=${ODOO_DB_PASSWORD:-password}
      - ODOO_DB_HOST=${ODOO_DB_HOST:-postgresql}
      - ODOO_DB_PORT=${ODOO_DB_PORT:-5432}
      - ANALYTICS_CONFIG_FILE=/analytics/config.yaml
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    command:
      - /bin/bash
      - -c
      - |
        set -e
        JM=jobmanager:8081
        echo "Waiting for the session cluster at $$JM ..."
        until /opt/flink/bin/flink list -m $$JM >/dev/null 2>&1; do sleep 3; done
        running=$$(/opt/flink/bin/flink list -m $$JM -r 2>/dev/null | grep -c '(RUNNING)' || true)
        if [ "$${running:-0}" -gt 0 ]; then
          echo "$$running job(s) already running (recovered from HA); not resubmitting."
          exit 0
        fi
        echo "Submitting streaming jobs to the session cluster..."
        exec /opt/flink/bin/flink run -m $$JM -d \
          -c com.ozonehis.analytics.AnalyticsJob /opt/flink/usrlib/analytics-etl.jar streaming
    depends_on:
      jobmanager:
        condition: service_started
      kafka-setup:
        condition: service_completed_successfully
      analytics-migration:
        condition: service_completed_successfully

volumes:
   kafka-data: ~
networks:
  ozone-analytics:
